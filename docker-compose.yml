services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    container_name: inventory-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - build_data:/var/www/html/public/build
    env_file:
      - .env
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-inventory}
      - DB_USERNAME=${DB_USERNAME:-inventory_user}
      - DB_PASSWORD=${DB_PASSWORD:-inventory_pass}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventory-net

  webserver:
    image: nginx:1.27-alpine
    container_name: inventory-webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - build_data:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - inventory-net

  db:
    image: mysql:8.0
    container_name: inventory-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-inventory}
      - MYSQL_USER=${DB_USERNAME:-inventory_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-inventory_pass}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "127.0.0.1:3306:3306" # solo accesible desde el host, nunca expuesto a la red pública
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inventory-net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: inventory-phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_USER=${DB_USERNAME:-inventory_user}
      - PMA_PASSWORD=${DB_PASSWORD:-inventory_pass}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge

volumes:
  db_data:
  vendor_data:
  build_data:
